[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clearmic"
version = "0.2.0"
description = "%100 offline, 0 MB VRAM, ultra düşük gecikmeli AI mikrofon gürültü engelleyici"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
clearmic = "clearmic.main:main"

[tool.setuptools.packages.find]
include = ["clearmic*"]
