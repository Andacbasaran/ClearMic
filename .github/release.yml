changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: New Features & DSP
      labels:
        - enhancement
        - feature
    - title: Bug Fixes & Stability
      labels:
        - bug
        - fix
    - title: Hardware & Platform Compatibility
      labels:
        - compatibility
    - title: Documentation & Packaging
      labels:
        - documentation
        - packaging
    - title: Other Changes
      labels:
        - "*"
