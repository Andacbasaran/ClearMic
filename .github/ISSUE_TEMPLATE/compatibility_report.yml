name: Hardware / App Compatibility Report
description: Report how ClearMic performs with a specific microphone, audio interface, virtual cable, or voice app.
title: "[Compat]: "
labels: ["compatibility"]
body:
  - type: input
    id: mic
    attributes:
      label: Microphone / Audio Interface
      placeholder: "e.g. Shure MV7, Focusrite Scarlett 2i2, MacBook Pro Built-in Mic"
    validations:
      required: true
  - type: input
    id: target_app
    attributes:
      label: Target Voice / Streaming App
      placeholder: "e.g. Discord, OBS Studio, Zoom, Microsoft Teams, Valorant"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Compatibility Status
      options:
        - Works flawlessly (Verified)
        - Works with minor workaround
        - Issue / Broken
    validations:
      required: true
  - type: input
    id: latency
    attributes:
      label: Observed CPU Latency & Sample Rate
      placeholder: "e.g. 0.9 ms CPU @ 48 kHz (WASAPI / Core Audio / PipeWire)"
  - type: textarea
    id: notes
    attributes:
      label: Notes & Recommended Preset
      placeholder: Share any helpful routing tips or preset notes for other users.
